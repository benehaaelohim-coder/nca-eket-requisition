<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCA EKET E-Requisition</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#662D91">
<style>
  :root{--primary:#662D91;--primary2:#4e1f70}
  html,body{height:100%;margin:0;font-family:Arial,sans-serif}
  .bar{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:10px 14px;
       display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .bar b{font-size:14px}
  .bar small{display:block;opacity:.85;font-size:11px}
  .bar button{border:0;border-radius:8px;padding:8px 12px;background:#fff;color:var(--primary);
              font-weight:bold;cursor:pointer;font-size:13px}
  .bar button:disabled{opacity:.6;cursor:not-allowed}
  #frameWrap{position:fixed;top:56px;left:0;right:0;bottom:0}
  #portal{width:100%;height:100%;border:0}
  @media(max-width:600px){#frameWrap{top:74px}}
</style>
</head>
<body>

<div class="bar">
  <div>
    <b>NCA EKET E-Requisition</b>
    <small id="statusLine">🔔 Notifications: checking…</small>
  </div>
  <button id="enableBtn">🔔 Enable Notifications</button>
</div>

<div id="frameWrap">
  <iframe id="portal" src="NCA_APPS_SCRIPT_URL_PLACEHOLDER" allow="clipboard-write"></iframe>
</div>

<script src="./firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
<script>
/**
 * NCA EKET GitHub Pages PWA shell.
 *
 * This page's ONLY job is to:
 *  1. Get permission + an FCM device token from the browser (this
 *     requires a real user click, which only works at THIS top level —
 *     the Apps Script portal is sandboxed inside an <iframe> and cannot
 *     request notification permission itself).
 *  2. Hand that token to the Apps Script portal (running in the iframe
 *     below) via postMessage, so it can save the token against the
 *     logged-in management user.
 *
 * Before deploying: fill in the placeholder values in firebase-config.js
 * and replace NCA_APPS_SCRIPT_URL_PLACEHOLDER below with your deployed
 * Apps Script /exec URL (also settable via firebase-config.js's
 * NCA_APPS_SCRIPT_URL if you prefer — see bottom of this script).
 */

const statusLine = document.getElementById('statusLine');
const enableBtn = document.getElementById('enableBtn');
const portalFrame = document.getElementById('portal');

// If the iframe src still has the placeholder, swap in the configured URL.
if (portalFrame.getAttribute('src') === 'NCA_APPS_SCRIPT_URL_PLACEHOLDER') {
  portalFrame.src = NCA_APPS_SCRIPT_URL;
}

let messaging = null;
let cachedToken = localStorage.getItem('nca_fcm_token') || null;

function configLooksReal() {
  return NCA_FIREBASE_CONFIG.apiKey && NCA_FIREBASE_CONFIG.apiKey.indexOf('YOUR_') !== 0 &&
         NCA_FCM_VAPID_KEY && NCA_FCM_VAPID_KEY.indexOf('YOUR_') !== 0;
}

function setStatus(text) {
  statusLine.textContent = text;
}

async function initFirebase() {
  if (!configLooksReal()) {
    setStatus('⚠️ Firebase config not set (edit firebase-config.js)');
    enableBtn.disabled = true;
    return;
  }

  firebase.initializeApp(NCA_FIREBASE_CONFIG);
  messaging = firebase.messaging();

  // Foreground push (tab open and focused): show a native notification
  // ourselves, since onMessage() does not auto-display one.
  messaging.onMessage(payload => {
    const title = (payload.notification && payload.notification.title) || 'NCA EKET Requisition';
    const body = (payload.notification && payload.notification.body) || '';
    if (Notification.permission === 'granted') {
      new Notification(title, { body: body, icon: './icon-192.png' });
    }
  });

  if (Notification.permission === 'granted' && cachedToken) {
    setStatus('🔔 Notifications: enabled on this device');
    enableBtn.textContent = '🔔 Notifications Enabled';
  } else if (Notification.permission === 'denied') {
    setStatus('🔔 Notifications: blocked in browser settings');
  } else {
    setStatus('🔔 Notifications: not enabled yet');
  }
}

async function enableNotifications() {
  if (!messaging) { setStatus('⚠️ Firebase is not configured yet.'); return; }

  enableBtn.disabled = true;
  setStatus('🔔 Requesting permission…');

  try {
    const permission = await Notification.requestPermission();

    if (permission !== 'granted') {
      setStatus('🔔 Notifications: permission not granted');
      enableBtn.disabled = false;
      return;
    }

    const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    const token = await messaging.getToken({
      vapidKey: NCA_FCM_VAPID_KEY,
      serviceWorkerRegistration: registration
    });

    if (!token) throw new Error('No token was returned by Firebase.');

    cachedToken = token;
    localStorage.setItem('nca_fcm_token', token);

    setStatus('🔔 Notifications: enabled on this device');
    enableBtn.textContent = '🔔 Notifications Enabled';

    // If the management portal is already logged in and waiting, hand
    // the token over immediately.
    portalFrame.contentWindow.postMessage({ type: 'NCA_EKET_FCM_TOKEN', token: token }, '*');

  } catch (error) {
    console.error(error);
    setStatus('🔔 Could not enable notifications: ' + error.message);
  } finally {
    enableBtn.disabled = false;
  }
}

enableBtn.addEventListener('click', enableNotifications);

// Bridge: relay messages between the Apps Script portal (iframe) and
// Firebase (this top-level page).
window.addEventListener('message', async event => {
  const data = event.data || {};
  const replyTo = event.source; // reply to whichever frame actually sent this, not a stale reference

  if (data.type === 'NCA_EKET_PORTAL_READY') {
    // No-op — just confirms the iframe finished loading and can receive messages.
    return;
  }

  if (data.type === 'NCA_EKET_REQUEST_FCM_TOKEN') {
    if (cachedToken && Notification.permission === 'granted') {
      replyTo.postMessage({ type: 'NCA_EKET_FCM_TOKEN', token: cachedToken }, '*');
      return;
    }

    if (Notification.permission === 'granted' && messaging) {
      // Permission already granted from a previous visit — fetching a
      // token again does not require a fresh user gesture.
      try {
        const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
        await navigator.serviceWorker.ready;
        const token = await messaging.getToken({ vapidKey: NCA_FCM_VAPID_KEY, serviceWorkerRegistration: registration });
        cachedToken = token;
        localStorage.setItem('nca_fcm_token', token);
        replyTo.postMessage({ type: 'NCA_EKET_FCM_TOKEN', token: token }, '*');
      } catch (error) {
        replyTo.postMessage({ type: 'NCA_EKET_FCM_TOKEN_ERROR', message: error.message }, '*');
      }
      return;
    }

    replyTo.postMessage({
      type: 'NCA_EKET_FCM_TOKEN_ERROR',
      message: 'Tap the 🔔 Enable Notifications button at the top of this page first.'
    }, '*');
    return;
  }

  if (data.type === 'NCA_EKET_NOTIFICATION_REGISTERED') {
    setStatus('🔔 Notifications: device registered to your account');
  }
});

initFirebase();
</script>
</body>
</html>
