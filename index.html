<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCA GLOBAL E-Requisition</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#662D91">

<style>

*{ box-sizing:border-box; }

body{
margin:0;
font-family: Arial, sans-serif;
background:#f4f5f8;
}

#topbar{
height:60px;
background: linear-gradient(135deg,#662D91,#4e1f70);
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding: 0 15px;
box-shadow:0 0 40px 6px rgba(102,45,145,0.55);
position:relative;
z-index:1;
}

.brand{ font-weight:bold; font-size:15px; }

button{
border:0;
padding: 9px 12px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

#notifyBtn{ background:white; color:#662D91; }

#status{
font-size:11px;
padding:5px 10px;
background:white;
color:#333;
text-align:center;
}

iframe{
width:100%;
height: calc(100vh - 85px);
border:0;
background:white;
}

</style>
</head>

<body>

<div id="topbar">
<div class="brand"></div>
<button id="notifyBtn">🔔 Enable Notifications</button>
</div>

<div id="status">Loading system...</div>

<iframe id="portal" src="https://script.google.com/macros/s/AKfycbzonygCenDGufNEwecUW8VI1-698tD11wNmzj1InljFrKUe4CdKb5y4seUu2CfcIyAK/exec"></iframe>

<script type="module">

/* ================================================
   FIREBASE IMPORTS
================================================ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";

/* ================================================
   YOUR FIREBASE CONFIGURATION
   (same values as firebase-config.js / firebase-messaging-sw.js)
================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyBTIW86UDfX_vwomDtlsCbgzdjWMR5LbKY",
  authDomain: "nca-eket-procurement.firebaseapp.com",
  projectId: "nca-eket-procurement",
  storageBucket: "nca-eket-procurement.firebasestorage.app",
  messagingSenderId: "821123646276",
  appId: "1:821123646276:web:e2b09bfe7c5429d65a8d11"
};

// Must match the Apps Script deployment used in the iframe src above.
// NOTE: registration now happens over a direct HTTP POST to this URL's
// doPost() handler — NOT via postMessage into the iframe. Google's own
// sandboxing silently drops postMessage traffic sent from an external
// origin into an HtmlService iframe, so that path never worked reliably.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzonygCenDGufNEwecUW8VI1-698tD11wNmzj1InljFrKUe4CdKb5y4seUu2CfcIyAK/exec";

/* ================================================
   FIREBASE
================================================ */

const app = initializeApp(firebaseConfig);
const messaging = getMessaging(app);

const notifyBtn = document.getElementById('notifyBtn');
const status = document.getElementById('status');
const portal = document.getElementById('portal');

let currentToken = '';
let loggedInUser = null; // { username, role } — set once the dashboard iframe reports a login

/* ================================================
   REGISTER SERVICE WORKER
================================================ */

async function registerServiceWorker(){
  return await navigator.serviceWorker.register('firebase-messaging-sw.js');
}

/* ================================================
   ENABLE NOTIFICATIONS
================================================ */

async function enableNotifications(){
  try{

    if (!('Notification' in window)){
      throw new Error('Notifications are not supported by this browser.');
    }

    const permission = await Notification.requestPermission();

    if (permission !== 'granted'){
      throw new Error('Notification permission was not granted.');
    }

    status.textContent = 'Preparing notifications...';

    const registration = await registerServiceWorker();

    const token = await getToken(messaging, {
      serviceWorkerRegistration: registration,
      // NOTE: replace with your real VAPID key from
      // Firebase Console -> Project Settings -> Cloud Messaging -> Web Push certificates
      vapidKey: "BHdiWSDWpYehJTDZ2rHImeIGCQ7VU9BojBmNE5puvndkMOrHOlaFtLImAG1vzmLHiU6oANbKnNVoX15Ot6pH2Ec"
    });

    if (!token){
      throw new Error('Unable to generate notification token.');
    }

    currentToken = token;

    localStorage.setItem('NCA_EKET_FCM_TOKEN', token);

    notifyBtn.textContent = '🔔 Notifications Enabled';
    status.textContent = 'Notifications enabled successfully.';

    await maybeRegisterDevice();

  }catch(error){

    console.error(error);
    status.textContent = 'Notification error: ' + error.message;

  }
}

/* ================================================
   REGISTER DEVICE DIRECTLY WITH THE BACKEND
   (replaces the old postMessage-into-iframe approach, which
   Google's sandbox silently blocks)
================================================ */

async function maybeRegisterDevice(){

  if (!currentToken){
    currentToken = localStorage.getItem('NCA_EKET_FCM_TOKEN') || '';
  }

  if (!currentToken || !loggedInUser){
    return; // wait until we have both a token and a known logged-in user
  }

  try{

    status.textContent = 'Registering device...';

    // mode: 'no-cors' because Apps Script web apps don't return
    // Access-Control-Allow-Origin headers for cross-origin requests.
    // The request still reaches doPost() and still writes the row —
    // we just can't read the response body back.
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        username: loggedInUser.username,
        role: loggedInUser.role,
        token: currentToken
      })
    });

    status.textContent = 'Device registered for notifications.';

  }catch(error){

    console.error('Device registration request failed:', error);
    status.textContent = 'Could not reach server to register device.';

  }
}

/* ================================================
   LISTEN FOR MESSAGES FROM THE DASHBOARD IFRAME
   (iframe -> wrapper direction is NOT blocked by Google's sandbox —
   only wrapper -> iframe is)
================================================ */

window.addEventListener('message', event => {

  const data = event.data || {};

  if (data.type === 'NCA_EKET_USER_LOGGED_IN'){
    loggedInUser = { username: data.username, role: data.role };
    maybeRegisterDevice();
  }

  if (data.type === 'NCA_EKET_PORTAL_READY'){
    status.textContent = 'NCA GLOBAL System Ready.';
  }

});

/* ================================================
   ENABLE BUTTON
================================================ */

notifyBtn.addEventListener('click', enableNotifications);

/* ================================================
   RESTORE TOKEN ON RELOAD
================================================ */

const savedToken = localStorage.getItem('NCA_EKET_FCM_TOKEN');

if (savedToken){
  currentToken = savedToken;
  notifyBtn.textContent = '🔔 Notifications Enabled';
  // Registration itself still waits for loggedInUser to arrive via the
  // NCA_EKET_USER_LOGGED_IN message once the user logs in below.
}

/* ================================================
   FOREGROUND MESSAGES
================================================ */

onMessage(messaging, payload => {

  console.log('Foreground notification:', payload);

  const notification = payload.notification;

  if (notification){
    new Notification(
      notification.title || 'NCA GLOBAL Notification',
      { body: notification.body || 'You have a new notification.' }
    );
  }

});

/* ================================================
   PWA SERVICE WORKER
================================================ */

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(console.error);
}

</script>

</body>
</html>
