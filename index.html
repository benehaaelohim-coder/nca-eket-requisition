<html lang="en">
<head>

<meta charset="UTF-8">

<title>NCA GLOBAL E-Requisition</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#662D91">

<style>

*{ box-sizing:border-box; }

body{
margin:0;
font-family: Arial, sans-serif;
background:#f4f5f8;

min-height:60px;

</div>

<div id="status">Loading system...</div>

<iframe id="portal" src="https://script.google.com/macros/s/AKfycbzonygCenDGufNEwecUW8VI1-698tD11wNmzj1InljFrKUe4CdKb5y4seUu2CfcIyAK/exec"></iframe>

<!-- ============================================================
     PART 1 — FINGERPRINT / FACE ID  (plain script, no Firebase)
     Runs on its own so a push-notification problem can never break it.
============================================================ -->
<script>
(function(){

const WRAPPER_VERSION = 'wrapper v8.23';
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzonygCenDGufNEwecUW8VI1-698tD11wNmzj1InljFrKUe4CdKb5y4seUu2CfcIyAK/exec";

const bioBtn = document.getElementById('bioBtn');
const statusEl = document.getElementById('status');
const portal = document.getElementById('portal');

window.__ncaSessionToken = null;   // shared with the notification script below
let bioSupported = false;
let bioReason = '';

function setStatus(text){ statusEl.textContent = text; }

const BIO_KEY = 'NCA_BIO_V2';

function bioStored(){ try{ return JSON.parse(localStorage.getItem(BIO_KEY) || 'null'); }catch(e){ return null; } }
function bioSave(v){ try{ localStorage.setItem(BIO_KEY, JSON.stringify(v)); }catch(e){} }
function bioWipe(){ try{ localStorage.removeItem(BIO_KEY); }catch(e){} }

function randomHex(bytes){
  return [...crypto.getRandomValues(new Uint8Array(bytes))].map(b => b.toString(16).padStart(2,'0')).join('');
}
function toB64u(buf){
  let s=''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromB64u(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length % 4) str += '=';
  const bin = atob(str); const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function newUuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const h = randomHex(16);
  return h.slice(0,8)+'-'+h.slice(8,12)+'-4'+h.slice(13,16)+'-a'+h.slice(17,20)+'-'+h.slice(20,32);
}
function deviceLabel(){
  const ua = navigator.userAgent;
  if(/iPhone|iPad/.test(ua)) return 'iPhone/iPad';
  if(/Android/.test(ua)) return 'Android';
  if(/Mac/.test(ua)) return 'Mac';
  if(/Windows/.test(ua)) return 'Windows';
  return 'Device';
}

function postBackend(body){
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
}

function refreshBioButton(){
  if(!bioSupported){
    bioBtn.classList.add('hidden');
    return;
  }
  const enrolled = !!bioStored();
  const loggedIn = !!window.__ncaSessionToken;

  bioBtn.classList.remove('hidden');

  if(enrolled && !loggedIn) bioBtn.textContent = '👆 Use Fingerprint / Face ID';
  else if(!enrolled && loggedIn) bioBtn.textContent = '👆 Enable Fingerprint / Face ID';
  else if(enrolled && loggedIn) bioBtn.textContent = '👆 Remove Fingerprint Login';
  else bioBtn.textContent = '👆 Set Up Fingerprint / Face ID';
}
window.__ncaRefreshBio = refreshBioButton;

async function bioEnroll(){
  const deviceId = newUuid();
  const deviceToken = randomHex(32);

  const cred = await navigator.credentials.create({ publicKey:{
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp:{ name:'NCA Global Portal' },
    user:{ id:new TextEncoder().encode(deviceId), name:'nca-user', displayName:'NCA User' },
    pubKeyCredParams:[{ type:'public-key', alg:-7 },{ type:'public-key', alg:-257 }],
    authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' },
    attestation:'none',
    timeout:60000
  }});

  setStatus('Saving fingerprint login on the server...');
  await postBackend({ action:'bioEnroll', sessionToken: window.__ncaSessionToken, deviceId: deviceId, deviceToken: deviceToken, label: deviceLabel() });
  bioSave({ deviceId: deviceId, deviceToken: deviceToken, credId: toB64u(cred.rawId) });
}

async function bioLogin(){
  const s = bioStored();
  if(!s) return;

  try{
    await navigator.credentials.get({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{ type:'public-key', id: fromB64u(s.credId), transports:['internal'] }],
      userVerification:'required',
      timeout:60000
    }});
  }catch(error){
    setStatus('Fingerprint / Face ID check was cancelled or failed.');
    return;
  }

  try{
    setStatus('Signing in...');
    const otc = randomHex(16);
    await postBackend({ action:'bioLogin', deviceId: s.deviceId, deviceToken: s.deviceToken, otc: otc });
    window.__ncaSessionToken = null;
    portal.src = APPS_SCRIPT_URL + '?otc=' + otc;
  }catch(error){
    setStatus('Could not reach the server. Check your internet connection.');
  }
}

async function bioToggle(){
  const enrolled = !!bioStored();
  const loggedIn = !!window.__ncaSessionToken;

  try{
    if(enrolled && !loggedIn){
      await bioLogin();
    }else if(!enrolled && loggedIn){
      await bioEnroll();
      setStatus('Fingerprint / Face ID login enabled on this device.');
      alert('Fingerprint / Face ID login is now enabled on this device.');
    }else if(enrolled && loggedIn){
      const s = bioStored();
      await postBackend({ action:'bioRemove', sessionToken: window.__ncaSessionToken, deviceId: s.deviceId });
      bioWipe();
      setStatus('Fingerprint login removed from this device.');
    }else{
      setStatus('Log in with your password first, then tap this button again.');
      alert('Please log in with your username and password first, then tap this button to enable Fingerprint / Face ID.');
    }
  }catch(error){
    console.error(error);
    setStatus('Fingerprint setup failed: ' + (error && error.name ? error.name : 'unknown') + ' — ' + (error && error.message ? error.message : ''));
  }
  refreshBioButton();
}

bioBtn.addEventListener('click', bioToggle);

(async function detect(){
  const ua = navigator.userAgent || '';
  try{
    if(!window.isSecureContext){
      bioReason = 'page is not HTTPS';
    }else if(/FBAN|FBAV|Instagram|WhatsApp|Line\/|MicroMessenger|; wv\)/i.test(ua)){
      bioReason = 'open this link in Chrome or Safari, not inside another app';
    }else if(!window.PublicKeyCredential || !navigator.credentials){
      bioReason = 'this browser has no WebAuthn support';
    }else if(!PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable){
      bioReason = 'this browser cannot check for a fingerprint sensor';
    }else if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){
      bioReason = 'no screen lock / fingerprint / Face ID is set up on this phone';
    }else{
      bioSupported = true;
    }
  }catch(e){
    bioReason = 'check failed: ' + e.message;
  }

  setStatus(WRAPPER_VERSION + ' — Fingerprint: ' + (bioSupported ? 'available' : 'not available (' + bioReason + ')'));
  refreshBioButton();
})();

/* Messages from the portal (it sends them to window.top, which is this page). */
window.addEventListener('message', function(event){
  const data = event.data || {};

  if (data.type === 'NCA_EKET_USER_LOGGED_IN'){
    window.__ncaSessionToken = data.sessionToken || null;
    refreshBioButton();
    if(window.__ncaMaybeRegisterDevice) window.__ncaMaybeRegisterDevice();
  }

  if (data.type === 'NCA_EKET_USER_LOGGED_OUT'){
    window.__ncaSessionToken = null;
    setStatus('Logged out.');
    refreshBioButton();
  }

  if (data.type === 'NCA_EKET_PORTAL_READY'){
    setStatus('NCA GLOBAL System Ready (' + WRAPPER_VERSION + ').' + (bioSupported ? '' : ' Fingerprint not available: ' + bioReason));
  }

  if (data.type === 'NCA_BIO_INVALID'){
    bioWipe();
    refreshBioButton();
  }
});

})();
</script>


<!-- ============================================================
     PART 2 — PUSH NOTIFICATIONS (Firebase). Failure here is isolated.
============================================================ -->
<script type="module">

const notifyBtn = document.getElementById('notifyBtn');
const statusEl = document.getElementById('status');

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzonygCenDGufNEwecUW8VI1-698tD11wNmzj1InljFrKUe4CdKb5y4seUu2CfcIyAK/exec";

const firebaseConfig = {
  apiKey: "AIzaSyBTIW86UDfX_vwomDtlsCbgzdjWMR5LbKY",
  authDomain: "nca-eket-procurement.firebaseapp.com",
  projectId: "nca-eket-procurement",
  storageBucket: "nca-eket-procurement.firebasestorage.app",
  messagingSenderId: "821123646276",
  appId: "1:821123646276:web:e2b09bfe7c5429d65a8d11"
};

let messaging = null;
let getToken = null;
let currentToken = '';

try{
  const appMod = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js");
  const msgMod = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js");

  const supported = await msgMod.isSupported();
  if(!supported) throw new Error('Push notifications are not supported in this browser.');

  const app = appMod.initializeApp(firebaseConfig);
  messaging = msgMod.getMessaging(app);
  getToken = msgMod.getToken;

  msgMod.onMessage(messaging, payload => {
    const notification = payload.notification;
    if (notification){
      try{
        new Notification(
          notification.title || 'NCA GLOBAL Notification',
          { body: notification.body || 'You have a new notification.' }
        );
      }catch(e){}
    }
  });
}catch(error){
  console.warn('Notifications unavailable:', error.message);
  notifyBtn.classList.add('hidden');
}

async function registerServiceWorker(){
  return await navigator.serviceWorker.register('firebase-messaging-sw.js');
}

async function enableNotifications(){
  try{

    if (!messaging) throw new Error('Notifications are not supported by this browser.');

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') throw new Error('Notification permission was not granted.');

    statusEl.textContent = 'Preparing notifications...';

    const registration = await registerServiceWorker();

    const token = await getToken(messaging, {
      serviceWorkerRegistration: registration,
      vapidKey: "BHdiWSDWpYehJTDZ2rHImeIGCQ7VU9BojBmNE5puvndkMOrHOlaFtLImAG1vzmLHiU6oANbKnNVoX15Ot6pH2Ec"
    });

    if (!token) throw new Error('Unable to generate notification token.');

    currentToken = token;
    localStorage.setItem('NCA_EKET_FCM_TOKEN', token);

    notifyBtn.textContent = '🔔 Notifications Enabled';
    statusEl.textContent = 'Notifications enabled successfully.';

    await maybeRegisterDevice();

  }catch(error){
    console.error(error);
    statusEl.textContent = 'Notification error: ' + error.message;
  }
}

async function maybeRegisterDevice(){

  if (!currentToken){
    currentToken = localStorage.getItem('NCA_EKET_FCM_TOKEN') || '';
  }

  const sessionToken = window.__ncaSessionToken;
  if (!currentToken || !sessionToken) return;

  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ sessionToken: sessionToken, deviceToken: currentToken })
    });
  }catch(error){
    console.error('Device registration request failed:', error);
  }
}

window.__ncaMaybeRegisterDevice = maybeRegisterDevice;

notifyBtn.addEventListener('click', enableNotifications);

const savedToken = localStorage.getItem('NCA_EKET_FCM_TOKEN');
if (savedToken){
  currentToken = savedToken;
  notifyBtn.textContent = '🔔 Notifications Enabled';
}

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(console.error);
}

</script>

</body>
</html>
