<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#662D91">

  <meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
     content="default">

  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" href="./icon-192.png">

  <title>NCA EKET e-Requisition</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
    }

    .appbar {
      height: 56px;
      background: #662D91;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-weight: bold;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .brand img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      border: 1px solid #ffffff;
      background: transparent;
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: rgba(255,255,255,0.15);
    }

    iframe {
      width: 100%;
      height: calc(100vh - 56px);
      border: 0;
      display: block;
    }

    @media (max-width: 500px) {

      .appbar {
        padding: 0 8px;
      }

      .brand span {
        max-width: 150px;
      }

      button {
        padding: 7px 8px;
        font-size: 12px;
      }

    }

  </style>

</head>

<body>

  <div class="appbar">

```
<div class="brand">

  <img
    src="./icon-192.png"
    alt="NCA EKET Logo">

  <span>NCA EKET e-Requisition</span>

</div>

<div class="actions">

  <button
    id="notificationButton"
    type="button">

    🔔 Enable

  </button>

  <button
    id="refreshButton"
    type="button">

    Refresh

  </button>

</div>
```

  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbztHgcPC3D55KKvTFbjBO7DXp54Z34ge2ir_4fURy-Pu4Vk3Ar-yr-J6LLbJATr5__-/exec"
    title="NCA EKET e-Requisition">

  </iframe>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

    import {
      getMessaging,
      getToken,
      onMessage
    }
      from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";


    /*
    ==========================================
    FIREBASE CONFIGURATION
    ==========================================
    */

    const firebaseConfig = {

      apiKey: "AIzaSyBTIW86UDfX_vwomDtlsCbgzdjWMR5LbKY",

      authDomain:
        "nca-eket-procurement.firebaseapp.com",

      projectId:
        "nca-eket-procurement",

      storageBucket:
        "nca-eket-procurement.firebasestorage.app",

      messagingSenderId:
        "821123646276",

      appId:
        "1:821123646276:web:e2b09bfe7c5429d65a8d11"

    };


    /*
    ==========================================
    FIREBASE VAPID PUBLIC KEY
    ==========================================
    */

    const VAPID_KEY =
      "BHdiWSDWpYehJTDZ2rHImeIGCQ7VU9BojBmNE5puvndkMOrHOlaFtLImAG1vzmLHiU6oANbKnNVoX15Ot6pH2Ec";


    /*
    ==========================================
    INITIALIZE FIREBASE
    ==========================================
    */

    const firebaseApp =
      initializeApp(firebaseConfig);

    const messaging =
      getMessaging(firebaseApp);


    /*
    ==========================================
    PAGE ELEMENTS
    ==========================================
    */

    const notificationButton =
      document.getElementById(
        "notificationButton"
      );

    const refreshButton =
      document.getElementById(
        "refreshButton"
      );

    const iframe =
      document.getElementById(
        "app"
      );


    /*
    ==========================================
    REGISTER MAIN SERVICE WORKER
    ==========================================
    */

    let mainServiceWorkerRegistration = null;


    async function registerMainServiceWorker() {

      if (!("serviceWorker" in navigator)) {

        console.log(
          "Service Workers are not supported."
        );

        return null;

      }

      try {

        mainServiceWorkerRegistration =
          await navigator.serviceWorker.register(
            "./sw.js"
          );

        console.log(
          "NCA PWA Service Worker Registered"
        );

        return mainServiceWorkerRegistration;

      }

      catch (error) {

        console.error(
          "Service Worker Registration Failed:",
          error
        );

        return null;

      }

    }


    /*
    ==========================================
    REGISTER FIREBASE MESSAGING SERVICE WORKER
    ==========================================
    */

    let firebaseMessagingRegistration = null;


    async function registerFirebaseMessagingWorker() {

      if (!("serviceWorker" in navigator)) {

        return null;

      }

      try {

        firebaseMessagingRegistration =
          await navigator.serviceWorker.register(
            "./firebase-messaging-sw.js"
          );

        console.log(
          "Firebase Messaging Service Worker Registered"
        );

        return firebaseMessagingRegistration;

      }

      catch (error) {

        console.error(
          "Firebase Messaging Worker Failed:",
          error
        );

        return null;

      }

    }


    /*
    ==========================================
    INITIALIZE SERVICE WORKERS
    ==========================================
    */

    async function initializeServiceWorkers() {

      await registerMainServiceWorker();

      await registerFirebaseMessagingWorker();

    }


    initializeServiceWorkers();


    /*
    ==========================================
    ENABLE NOTIFICATIONS
    ==========================================
    */

    async function enableNotifications() {

      if (!("Notification" in window)) {

        alert(
          "This browser does not support notifications."
        );

        return;

      }


      try {

        const permission =
          await Notification.requestPermission();


        if (permission !== "granted") {

          alert(
            "Notification permission was not granted."
          );

          notificationButton.textContent =
            "🔔 Enable";

          return;

        }


        notificationButton.textContent =
          "🔔 Connecting...";


        if (!firebaseMessagingRegistration) {

          await registerFirebaseMessagingWorker();

        }


        const token =
          await getToken(
            messaging,
            {

              vapidKey:
                VAPID_KEY,

              serviceWorkerRegistration:
                firebaseMessagingRegistration

            }
          );


        if (token) {

          console.log(
            "FCM DEVICE TOKEN:"
          );

          console.log(
            token
          );


          notificationButton.textContent =
            "🔔 Enabled";


          /*
          =====================================
          FUTURE BACKEND INTEGRATION
          =====================================

          The token will later be sent to your
          Google Apps Script backend together with:

          - User Name
          - User Role
          - Device Token

          Roles:

          Pastor
          Assistant Pastor
          System Administrator
          Account Officer
          Procurement Officer

          */


          alert(
            "Notifications have been enabled successfully!"
          );


        }

        else {

          console.log(
            "No registration token available."
          );

          notificationButton.textContent =
            "🔔 Enable";


          alert(
            "Could not register this device for notifications."
          );

        }

      }

      catch (error) {

        console.error(
          "Notification Error:",
          error
        );


        notificationButton.textContent =
          "🔔 Enable";


        alert(
          "Notification setup failed. Please try again."
        );

      }

    }


    /*
    ==========================================
    NOTIFICATION BUTTON
    ==========================================
    */

    notificationButton.addEventListener(
      "click",
      enableNotifications
    );


    /*
    ==========================================
    REFRESH BUTTON
    ==========================================
    */

    refreshButton.addEventListener(
      "click",
      () => {

        iframe.src =
          iframe.src;

      }
    );


    /*
    ==========================================
    FOREGROUND NOTIFICATIONS
    ==========================================
    */

    onMessage(
      messaging,
      (payload) => {

        console.log(
          "Foreground Notification:",
          payload
        );


        const title =
          payload?.notification?.title
          ||
          "NCA EKET Notification";


        const options = {

          body:
            payload?.notification?.body
            ||
            "You have a new notification.",

          icon:
            "./icon-192.png",

          badge:
            "./icon-192.png"

        };


        if (
          Notification.permission ===
          "granted"
        ) {

          new Notification(
            title,
            options
          );

        }

      }
    );

  </script>

</body>
</html>
