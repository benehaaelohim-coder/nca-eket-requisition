<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#662D91">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">

<title>NCA EKET e-Requisition V6.1</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#f5f5f7;
}

.appbar{
height:56px;
background:#662D91;
color:#ffffff;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 14px;

font-weight:bold;

box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand img{
width:34px;
height:34px;
object-fit:contain;
}

.version{
font-size:10px;
opacity:.8;
}

button{

border:1px solid #ffffff;

background:transparent;

color:#ffffff;

padding:8px 10px;

border-radius:8px;

font-weight:bold;

cursor:pointer;

}

iframe{

width:100%;

height:calc(100vh - 56px);

border:0;

display:block;

background:#ffffff;

}

</style>

</head>

<body>

<div class="appbar">

<div class="brand">

<img src="icon-192.png">

<div>

<div>NCA EKET e-Requisition</div>

<div class="version">
Version 6.1
</div>

</div>

</div>

<button onclick="refreshApp()">

↻ Refresh

</button>

</div>


<iframe

id="app"

src="https://script.google.com/macros/s/AKfycbzH_waWPIkybt-lrTq8T7pRyiPh2veOquurIzcVnDux67oBLexheMj9SNluILc9up8S/exec?v=6.1"

title="NCA EKET e-Requisition">

</iframe>


<script>

function refreshApp(){

const iframe =
document.getElementById("app");

const url =
"https://script.google.com/macros/s/AKfycbzH_waWPIkybt-lrTq8T7pRyiPh2veOquurIzcVnDux67oBLexheMj9SNluILc9up8S/exec";

iframe.src =
url + "?v=6.1&t=" + Date.now();

}


if("serviceWorker" in navigator){

window.addEventListener("load",function(){

navigator.serviceWorker
.register("./sw.js")

.then(function(registration){

console.log(
"NCA EKET Service Worker Active"
);

});

});

}

</script>

</body>
</html>
