<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCA GLOBAL E-Requisition</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#662D91">

<style>

*{ box-sizing:border-box; }

body{
margin:0;
font-family: Arial, sans-serif;
background:#f4f5f8;
}

#topbar{
min-height:60px;
background: linear-gradient(135deg,#662D91,#4e1f70);
color:white;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding: 8px 15px;
box-shadow:0 0 40px 6px rgba(102,45,145,0.55);
position:relative;
z-index:1;
}

.brand{ font-weight:bold; font-size:15px; }
.topButtons{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

button{
border:0;
padding: 9px 12px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

#notifyBtn, #bioBtn{ background:white; color:#662D91; }
.hidden{ display:none!important; }

#status{
font-size:11px;
padding:5px 10px;
background:white;
color:#333;
text-align:center;
}

iframe{
width:100%;
height: calc(100vh - 85px);
border:0;
background:white;
}

</style>
</head>

<body>

<div id="topbar">
<div class="brand"></div>
<div class="topButtons">
<button id="bioBtn" class="hidden"></button>
<button id="notifyBtn">🔔 Enable Notifications</button>
</div>
</div>

<div id="status">Loading system...</div>

<iframe id="portal" src="https://script.google.com/macros/s/AKfycbzonygCenDGufNEwecUW8VI1-698tD11wNmzj1InljFrKUe4CdKb5y4seUu2CfcIyAK/exec"></iframe>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTIW86UDfX_vwomDtlsCbgzdjWMR5LbKY",
  authDomain: "nca-eket-procurement.firebaseapp.com",
  projectId: "nca-eket-procurement",
  storageBucket: "nca-eket-procurement.firebasestorage.app",
  messagingSenderId: "821123646276",
  appId: "1:821123646276:web:e2b09bfe7c5429d65a8d11"
};

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzonygCenDGufNEwecUW8VI1-698tD11wNmzj1InljFrKUe4CdKb5y4seUu2CfcIyAK/exec";

const app = initializeApp(firebaseConfig);
const messaging = getMessaging(app);

const notifyBtn = document.getElementById('notifyBtn');
const bioBtn = document.getElementById('bioBtn');
const status = document.getElementById('status');
const portal = document.getElementById('portal');

let currentToken = '';
let sessionToken = null;

/* ================================================
   NOTIFICATIONS (unchanged)
================================================ */

async function registerServiceWorker(){
  return await navigator.serviceWorker.register('firebase-messaging-sw.js');
}

async function enableNotifications(){
  try{

    if (!('Notification' in window)){
      throw new Error('Notifications are not supported by this browser.');
    }

    const permission = await Notification.requestPermission();

    if (permission !== 'granted'){
      throw new Error('Notification permission was not granted.');
    }

    status.textContent = 'Preparing notifications...';

    const registration = await registerServiceWorker();

    const token = await getToken(messaging, {
      serviceWorkerRegistration: registration,
      vapidKey: "BHdiWSDWpYehJTDZ2rHImeIGCQ7VU9BojBmNE5puvndkMOrHOlaFtLImAG1vzmLHiU6oANbKnNVoX15Ot6pH2Ec"
    });

    if (!token){
      throw new Error('Unable to generate notification token.');
    }

    currentToken = token;
    localStorage.setItem('NCA_EKET_FCM_TOKEN', token);

    notifyBtn.textContent = '🔔 Notifications Enabled';
    status.textContent = 'Notifications enabled successfully.';

    await maybeRegisterDevice();

  }catch(error){
    console.error(error);
    status.textContent = 'Notification error: ' + error.message;
  }
}

async function maybeRegisterDevice(){

  if (!currentToken){
    currentToken = localStorage.getItem('NCA_EKET_FCM_TOKEN') || '';
  }

  if (!currentToken || !sessionToken){
    return;
  }

  try{

    status.textContent = 'Registering device...';

    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        sessionToken: sessionToken,
        deviceToken: currentToken
      })
    });

    status.textContent = 'Device registered for notifications.';

  }catch(error){
    console.error('Device registration request failed:', error);
    status.textContent = 'Could not reach server to register device.';
  }
}

/* ================================================
   FINGERPRINT / FACE ID (v8.22)
   The phone check runs HERE (top level), where WebAuthn is allowed.
================================================ */

const BIO_KEY = 'NCA_BIO_V2';
let bioSupported = false;

function bioStored(){ try{ return JSON.parse(localStorage.getItem(BIO_KEY) || 'null'); }catch(e){ return null; } }
function bioSave(v){ try{ localStorage.setItem(BIO_KEY, JSON.stringify(v)); }catch(e){} }
function bioWipe(){ try{ localStorage.removeItem(BIO_KEY); }catch(e){} }

function randomHex(bytes){
  return [...crypto.getRandomValues(new Uint8Array(bytes))].map(b => b.toString(16).padStart(2,'0')).join('');
}
function toB64u(buf){
  let s=''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromB64u(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length % 4) str += '=';
  const bin = atob(str); const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function deviceLabel(){
  const ua = navigator.userAgent;
  if(/iPhone|iPad/.test(ua)) return 'iPhone/iPad';
  if(/Android/.test(ua)) return 'Android';
  if(/Mac/.test(ua)) return 'Mac';
  if(/Windows/.test(ua)) return 'Windows';
  return 'Device';
}

function postBackend(body){
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
}

function refreshBioButton(){
  const enrolled = !!bioStored();
  const loggedIn = !!sessionToken;

  if(!bioSupported || (!enrolled && !loggedIn)){
    bioBtn.classList.add('hidden');
    return;
  }
  bioBtn.classList.remove('hidden');

  if(enrolled && !loggedIn) bioBtn.textContent = '👆 Use Fingerprint / Face ID';
  else if(!enrolled && loggedIn) bioBtn.textContent = '👆 Enable Fingerprint / Face ID';
  else bioBtn.textContent = '👆 Remove Fingerprint Login';
}

async function bioEnroll(){
  const deviceId = crypto.randomUUID();
  const deviceToken = randomHex(32);

  const cred = await navigator.credentials.create({ publicKey:{
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp:{ name:'NCA Global Portal' },
    user:{ id:new TextEncoder().encode(deviceId), name:'nca-user', displayName:'NCA User' },
    pubKeyCredParams:[{ type:'public-key', alg:-7 },{ type:'public-key', alg:-257 }],
    authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' },
    attestation:'none',
    timeout:60000
  }});

  await postBackend({ action:'bioEnroll', sessionToken: sessionToken, deviceId: deviceId, deviceToken: deviceToken, label: deviceLabel() });
  bioSave({ deviceId: deviceId, deviceToken: deviceToken, credId: toB64u(cred.rawId) });
}

async function bioLogin(){
  const s = bioStored();
  if(!s) return;

  try{
    await navigator.credentials.get({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{ type:'public-key', id: fromB64u(s.credId), transports:['internal'] }],
      userVerification:'required',
      timeout:60000
    }});
  }catch(error){
    status.textContent = 'Fingerprint / Face ID check was cancelled or failed.';
    return;
  }

  try{
    status.textContent = 'Signing in...';
    const otc = randomHex(16);
    await postBackend({ action:'bioLogin', deviceId: s.deviceId, deviceToken: s.deviceToken, otc: otc });
    sessionToken = null;
    portal.src = APPS_SCRIPT_URL + '?otc=' + otc;
  }catch(error){
    status.textContent = 'Could not reach the server. Check your internet connection.';
  }
}

async function bioToggle(){
  const enrolled = !!bioStored();
  const loggedIn = !!sessionToken;

  try{
    if(enrolled && !loggedIn){
      await bioLogin();
    }else if(!enrolled && loggedIn){
      await bioEnroll();
      status.textContent = 'Fingerprint / Face ID login enabled on this device.';
      alert('Fingerprint / Face ID login is now enabled on this device.');
    }else if(enrolled && loggedIn){
      const s = bioStored();
      await postBackend({ action:'bioRemove', sessionToken: sessionToken, deviceId: s.deviceId });
      bioWipe();
      status.textContent = 'Fingerprint login removed from this device.';
    }
  }catch(error){
    console.error(error);
    status.textContent = 'Fingerprint / Face ID setup was cancelled or is not available on this device.';
  }
  refreshBioButton();
}

bioBtn.addEventListener('click', bioToggle);

(async function(){
  try{
    bioSupported = !!(window.PublicKeyCredential && navigator.credentials &&
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable &&
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }catch(e){ bioSupported = false; }
  refreshBioButton();
})();

/* ================================================
   MESSAGES FROM THE PORTAL IFRAME
================================================ */

window.addEventListener('message', event => {

  const data = event.data || {};

  if (data.type === 'NCA_EKET_USER_LOGGED_IN'){
    sessionToken = data.sessionToken || null;
    maybeRegisterDevice();
    refreshBioButton();
  }

  if (data.type === 'NCA_EKET_USER_LOGGED_OUT'){
    sessionToken = null;
    status.textContent = 'Logged out.';
    refreshBioButton();
  }

  if (data.type === 'NCA_EKET_PORTAL_READY'){
    status.textContent = 'NCA GLOBAL System Ready.';
  }

  if (data.type === 'NCA_BIO_INVALID'){
    // Server rejected the saved fingerprint key (expired, password changed, etc.)
    bioWipe();
    refreshBioButton();
  }

});

notifyBtn.addEventListener('click', enableNotifications);

const savedToken = localStorage.getItem('NCA_EKET_FCM_TOKEN');

if (savedToken){
  currentToken = savedToken;
  notifyBtn.textContent = '🔔 Notifications Enabled';
}

onMessage(messaging, payload => {

  console.log('Foreground notification:', payload);

  const notification = payload.notification;

  if (notification){
    new Notification(
      notification.title || 'NCA GLOBAL Notification',
      { body: notification.body || 'You have a new notification.' }
    );
  }

});

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(console.error);
}

</script>

</body>
</html>
